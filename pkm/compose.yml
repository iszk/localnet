services:
  webdav:
    container_name: pkm-webdav
    image: ghcr.io/hacdias/webdav:v5.9
    # ports:
    #   - "6065:6065"
    volumes:
      - pkm-data:/data
      - ./webdav/config.yml:/config.yml:ro
    env_file:
      - ./webdav/.env
    restart: unless-stopped

    networks:
      - reverse-proxy

networks:
  reverse-proxy:
    name: reverse-proxy
    external: true

volumes:
  pkm-data:
